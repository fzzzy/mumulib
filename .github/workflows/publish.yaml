name: Publish

on:
  push:
    tags:
      - '*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'

      # The npm package, and its browser build copied into the Python one,
      # which builds itself below. make build would also sync py/, and this
      # job has no uv
      - name: Build project
        run: make dist

      # The wheel ships the browser build make dist copied into the package:
      # never publish one without it
      - name: Check the browser build is in the Python package
        run: test -f py/mumulib/browser/mumulib.mjs

      - name: Publish to npm
        run: npm publish
        working-directory: ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to pypi
        run: |
          python -m pip install --upgrade build twine
          cd py && python -m build && twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
