name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
      - run: npm ci
        working-directory: ts
      - run: npx playwright install --with-deps
        working-directory: ts
      - run: make check
