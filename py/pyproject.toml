[build-system]
requires = ["uv_build >= 0.11.28, < 0.12"]
build-backend = "uv_build"

[project]
name = "mumulib"
version = "2.0.0a1"
authors = [
  { name="Donovan Preston", email="46048+fzzzy@users.noreply.github.com" },
]
description = "There is no library, squared"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=24.1.0",
    # The event stream hub's: it subscribes to each topic over HTTP
    "httpx2>=2.13,<3",
    "python-multipart>=0.0.20",
    # In development, Vite's hot reloading websocket, passed on to it
    "websockets>=17.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
license = {file = "LICENSE"}

[project.optional-dependencies]
dev = [
    "ruff>=0.16.5",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # To run the fixtures -- Hypercorn for make run's HTTP/2, uvicorn for the
    # browser tests' servers; mumulib itself needs no particular ASGI server
    "uvicorn>=0.52.4",
    "hypercorn>=0.18.0",
    # make run's restarts, as Python changes: see mumulib.serve
    "watchfiles>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/fzzzy/mumulib"
Issues = "https://github.com/fzzzy/mumulib/issues"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

# The package is strict. Each *_test.py lowers itself to standard with a
# "# pyright: standard" comment on its first line: the tests are unannotated
# unittest code, but standard mode still catches wrong calls into the package.
[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["mumulib", "fixtures"]

[tool.pytest.ini_options]
testpaths = ["mumulib", "fixtures"]
python_files = ["*_test.py"]

[tool.coverage.run]
branch = true
source = ["mumulib"]
omit = ["*_test.py"]

[tool.coverage.report]
show_missing = true
precision = 1
# Measured on the package alone, tests omitted: every line and branch.
fail_under = 100

# The package is mumulib/, beside this file, and everything in it ships --
# live.js, the script consumers_app serves at /mumulib/live.js; browser/,
# the TypeScript library's browser build, which make dist copies in and
# every app serves at /mumulib/browser/; and py.typed, the marker for type
# checkers -- but its tests. They sit beside their
# modules, and are not the library: a checkout of the repository has them,
# and an install does not. The source distribution keeps them, with the
# files they read, for anyone building from it to run.
[tool.uv.build-backend]
module-root = ""
wheel-exclude = ["*_test.py"]
source-include = ["fixtures/unit/**"]
