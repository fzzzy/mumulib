[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mumulib"
version = "1.0.16"
authors = [
  { name="Donovan Preston", email="46048+fzzzy@users.noreply.github.com" },
]
description = "There is no library, squared"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=24.1.0",
    "lxml>=5.3.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
license = {file = "LICENSE"}

[project.optional-dependencies]
dev = [
    "ruff>=0.16.5",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # lxml ships no type information; without these, pyright strict cannot
    # see lxml.etree at all (reportMissingTypeStubs in tags.py).
    "lxml-stubs>=0.5.1",
    # To run the examples; mumulib itself needs no particular ASGI server
    "uvicorn>=0.52.4",
]

[project.urls]
Homepage = "https://github.com/fzzzy/mumulib"
Issues = "https://github.com/fzzzy/mumulib/issues"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

# The package is strict. Each *_test.py lowers itself to standard with a
# "# pyright: standard" comment on its first line: the tests are unannotated
# unittest code, but standard mode still catches wrong calls into the package.
[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["mumulib", "examples"]

[tool.pytest.ini_options]
testpaths = ["mumulib", "examples"]
python_files = ["*_test.py"]

[tool.coverage.run]
branch = true
source = ["mumulib"]
omit = ["*_test.py"]

[tool.coverage.report]
show_missing = true
precision = 1
# Measured on the package alone, tests omitted: 99.8%. The two partial
# branches left are defensive ones in tags.parse_template that lxml's
# iterparse never takes.
fail_under = 99.8

# Files in the package beside its modules, shipped with them: the script
# consumers_app serves at /mumulib/live.js, and the marker for type checkers
[tool.setuptools.package-data]
mumulib = ["live.js", "py.typed"]
