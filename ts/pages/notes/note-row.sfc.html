<!--
  A note: its text, or, being edited, a field for it; and, when someone else
  changed it meanwhile, which text to keep. It keeps nothing: the app gives
  it its note and how it stands, and it asks the app, with emit, to save,
  to stop, or to keep mine or theirs. The field is its own, to read as it
  asks.
-->
<template>
  <style>
    :host {
      display: block;
      margin: 0.4rem 0;
      border-radius: 6px;
      outline: none;
    }
    .note {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 2rem;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      background: #f6f6f4;
      cursor: grab;
      user-select: none;
      /* A finger drags the note, and does not scroll the page */
      touch-action: none;
    }
    /* This player's own focus, in its own colour */
    .note:focus {
      outline: 2px solid var(--me, #888);
      outline-offset: 1px;
    }
    .text,
    .edit {
      flex: 1;
    }
    .edit {
      font: inherit;
      padding: 0.15rem 0.3rem;
    }
    .edit[readonly] {
      background: #fff4f2;
      border-color: #c0322f;
    }
    .resolve {
      display: flex;
      gap: 0.3rem;
    }
    .shake {
      animation: shake 0.4s;
    }
    @keyframes shake {
      0%,
      100% {
        transform: translateX(0);
      }
      20%,
      60% {
        transform: translateX(-6px);
      }
      40%,
      80% {
        transform: translateX(6px);
      }
    }
    [hidden] {
      display: none !important;
    }
  </style>
  <div class="note" tabindex="0" data-ref="row">
    <span class="text" data-slot="text" data-attr="hidden=editing"
      >Buy milk</span
    >
    <input
      class="edit"
      aria-label="Note text"
      data-ref="field"
      data-attr="hidden=reading,readonly=clashed,class=fieldClass"
    />
    <span
      class="resolve"
      role="group"
      aria-label="Changed by someone else: keep which?"
      data-attr="hidden=calm"
    >
      <button type="button" data-ref="mine">Mine</button>
      <button type="button" data-ref="theirs">Theirs</button>
    </span>
  </div>
</template>

<script>
  import { Mumu } from 'mumulib'

  export default class NoteRow extends Mumu<{
    // The note's id: not "id", which every element has
    note: string
    text: string
    editing: boolean
    // Someone else changed it, or removed it, while it was being edited
    clashed: boolean
  }> {
    static template = template
    static state = { note: '', text: '', editing: false, clashed: false }

    #wasEditing = false

    get reading(): boolean {
      return !this.state.editing
    }
    get calm(): boolean {
      return !this.state.clashed
    }
    get fieldClass(): string {
      return this.state.clashed ? 'edit shake' : 'edit'
    }

    #field(): HTMLInputElement {
      return this.refs.field as HTMLInputElement
    }

    onRender(): void {
      const field = this.#field()
      if (this.state.editing && !this.#wasEditing) {
        // Begun: the field holds the text, selected, to type over
        field.value = this.state.text
        field.focus()
        field.select()
      }
      if (!this.state.editing && this.#wasEditing) {
        // Done: the row has the focus back, where the reader was
        ;(this.refs.row as HTMLElement).focus()
      }
      this.#wasEditing = this.state.editing
    }

    onKeyDown(event: KeyboardEvent): void {
      if (event.target !== this.#field() || this.state.clashed) return
      if (event.key === 'Enter') {
        event.preventDefault()
        this.emit('save', { note: this.state.note, text: this.#field().value })
      } else if (event.key === 'Escape') {
        event.preventDefault()
        this.emit('cancel', { note: this.state.note })
      }
    }

    // Leaving the field keeps what was typed -- but not when it is locked,
    // waiting on mine or theirs
    onFocusOut(event: FocusEvent): void {
      if (event.target !== this.#field() || !this.state.editing) return
      if (this.state.clashed) return
      this.emit('save', { note: this.state.note, text: this.#field().value })
    }

    onClick(event: MouseEvent): void {
      const keep =
        event.target === this.refs.mine
          ? 'mine'
          : event.target === this.refs.theirs
            ? 'theirs'
            : null
      if (keep === null) return
      this.emit('resolve', {
        note: this.state.note,
        keep,
        text: this.#field().value,
      })
    }
  }
</script>
