<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
  </head>
  <body>
    <header>
      <button
        id="trash"
        type="button"
        aria-label="Trash"
        title="Drag a note here to remove it"
      >
        <svg
          viewBox="0 0 16 16"
          width="22"
          height="22"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.75 6.5v4.5M9.25 6.5v4.5"
          />
        </svg>
      </button>
      <h1>Notes</h1>
      <ul id="players" aria-label="Who is here"></ul>
    </header>
    <ul id="notes" aria-label="Notes"></ul>
    <form id="add">
      <input name="text" type="text" required aria-label="A note" />
      <button>Add</button>
    </form>
    <script type="module" src="/notes/main.ts"></script>
  </body>
</html>
