<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editors</title>
    <style>
      body {
        font-family: serif;
        margin: 2em;
      }
      table {
        border-collapse: collapse;
        margin-bottom: 2em;
        min-width: 40em;
      }
      caption {
        text-align: left;
        font-weight: bold;
        padding: 0.5em 0;
      }
      th,
      td {
        border: 1px solid #888;
        padding: 0.4em 0.6em;
        text-align: left;
      }
      dialog label {
        display: block;
        margin-bottom: 1em;
      }
      dialog input:not([type='hidden']),
      dialog textarea {
        display: block;
        width: 28em;
        font: inherit;
      }
      dialog textarea {
        height: 8em;
      }
    </style>
    <script type="module" src="./editors.ts"></script>
  </head>

  <body>
    <!-- Each table's body is a slot, filled with a copy of its row pattern
         for each object; the rows below are sample data until it is -->
    <table id="characters">
      <caption>
        Characters
      </caption>
      <thead>
        <tr>
          <th>Name</th>
          <th>Prompt</th>
          <th>Agent args</th>
        </tr>
      </thead>
      <tbody data-slot="rows">
        <tr data-pat="character_row">
          <td>
            <a href="#" data-attr="data-edit=path" data-slot="name">Ada</a>
          </td>
          <td data-slot="prompt">A prompt</td>
          <td><code data-slot="agent_args">--ant</code></td>
        </tr>
      </tbody>
    </table>

    <table id="parties">
      <caption>
        Parties
      </caption>
      <thead>
        <tr>
          <th>Name</th>
          <th>Members</th>
        </tr>
      </thead>
      <tbody data-slot="rows">
        <tr data-pat="party_row">
          <td>
            <a href="#" data-attr="data-edit=path" data-slot="name">A party</a>
          </td>
          <td data-slot="members">Ada, Grace</td>
        </tr>
      </tbody>
    </table>

    <table id="deploys">
      <caption>
        Deploys
      </caption>
      <thead>
        <tr>
          <th>Name</th>
          <th>Party</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody data-slot="rows">
        <tr data-pat="deploy_row">
          <td>
            <a href="#" data-attr="data-edit=path" data-slot="name">A deploy</a>
          </td>
          <td data-slot="party">A party</td>
          <td data-slot="status">running</td>
        </tr>
      </tbody>
    </table>

    <!-- The edit dialogs. path names the object in the state to edit, and
         method the one of its methods that a submitted form calls, with
         the form's values -->
    <dialog id="character_dialog">
      <h2>Edit character</h2>
      <form>
        <input type="hidden" name="path" />
        <input type="hidden" name="method" value="save" />
        <label>Name <input name="name" required /></label>
        <label>System prompt <textarea name="prompt"></textarea></label>
        <label>Agent args <input name="agent_args" /></label>
        <button>Save</button>
        <button type="button" class="cancel">Cancel</button>
      </form>
    </dialog>

    <dialog id="party_dialog">
      <h2>Edit party</h2>
      <form>
        <input type="hidden" name="path" />
        <input type="hidden" name="method" value="save" />
        <label>Name <input name="name" required /></label>
        <label>Members <member-select name="members[]"></member-select></label>
        <button>Save</button>
        <button type="button" class="cancel">Cancel</button>
      </form>
    </dialog>

    <dialog id="deploy_dialog">
      <h2>Edit deploy</h2>
      <form>
        <input type="hidden" name="path" />
        <input type="hidden" name="method" value="save" />
        <label>Name <input name="name" required /></label>
        <label
          >Party
          <select name="party" data-slot="party_options">
            <option
              data-pat="party_option"
              data-attr="value=id"
              data-slot="label"
            >
              A party
            </option>
          </select>
        </label>
        <p>Status: <span data-slot="status">running</span></p>
        <button>Save</button>
        <button type="button" class="cancel">Cancel</button>
      </form>
    </dialog>
  </body>
</html>
