<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rows</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <!-- Rows from the state's own list: in a row, this. is the row's item,
       so each checkbox is bound to items.<its place>.done -- its place as
       the list is now, as rows come and go. -->
  <body>
    <ul data-slot="items">
      <template data-pat="foreach">
        <li data-attr="data-key=key">
          <label>
            <input type="checkbox" name="this.done" />
            <span data-slot="text">Water the plants</span>
          </label>
          <button class="remove" data-on="click=remove">Remove</button>
        </li>
      </template>
    </ul>
    <p class="count" data-slot="count">No things</p>
  </body>
</html>
