<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A bound component</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <!-- The app's title, given to the field component as its text, by
       data-prop: what is typed in the component's own input comes back up
       as a change of the app's title. -->
  <body>
    <h1 data-slot="title">Things to do</h1>
    <my-field data-prop="label=label,text=title"></my-field>
  </body>
</html>
